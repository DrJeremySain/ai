<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1100, initial-scale=1.0">
  <title>Complex Number Visualizer</title>
  <style>
    :root {
      --primary-color: #1b4d3e; /* Forest Green */
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }

    /* MAIN FLEX CONTAINER FOR SIDE-BY-SIDE PLANES */
    .planes-wrapper {
      width: 100%;
      overflow-x: auto; /* Safety scrollbar if outer viewport is narrower than min-width */
      padding-bottom: 10px;
    }

    .planes-container {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;          /* CRITICAL: Prevents planes from stacking vertically */
      justify-content: space-between;
      gap: 16px;
      min-width: 960px;           /* Holds minimum desktop width inside iframe */
      width: 100%;
    }

    /* INDIVIDUAL PLANE CARDS */
    .plane-card {
      flex: 1 1 0;                /* Distributes available width equally across all 3 */
      min-width: 300px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .plane-card h2 {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 10px;
      text-align: center;
    }

    /* CANVAS RESPONSIVENESS */
    .canvas-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      background-color: #fafafa;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .plane-description {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Complex Number Transformations</h1>
    <p class="subtitle">Interactive side-by-side plane visualizer</p>
  </header>

  <div class="planes-wrapper">
    <div class="planes-container">
      
      <!-- PLANE 1 -->
      <div class="plane-card">
        <h2>Input Plane ($z$)</h2>
        <div class="canvas-container">
          <canvas id="plane1"></canvas>
        </div>
        <p class="plane-description">Domain / Original Complex Number</p>
      </div>

      <!-- PLANE 2 -->
      <div class="plane-card">
        <h2>Intermediate Plane</h2>
        <div class="canvas-container">
          <canvas id="plane2"></canvas>
        </div>
        <p class="plane-description">Transformed Components</p>
      </div>

      <!-- PLANE 3 -->
      <div class="plane-card">
        <h2>Output Plane ($w$)</h2>
        <div class="canvas-container">
          <canvas id="plane3"></canvas>
        </div>
        <p class="plane-description">Mapped Output Coordinates</p>
      </div>

    </div>
  </div>

  <script>
    // Canvas setup helper to maintain sharp resolution
    function initCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      function resize() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        drawGrid(ctx, rect.width, rect.height);
      }

      window.addEventListener('resize', resize);
      resize();
    }

    // Example grid draw function
    function drawGrid(ctx, width, height) {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;

      const step = width / 10;

      // Grid lines
      for (let x = 0; x <= width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Main Axes
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(width / 2, 0); ctx.lineTo(width / 2, height);
      ctx.moveTo(0, height / 2); ctx.lineTo(width, height / 2);
      ctx.stroke();
    }

    // Initialize all three canvases
    initCanvas('plane1');
    initCanvas('plane2');
    initCanvas('plane3');
  </script>
</body>
</html>
