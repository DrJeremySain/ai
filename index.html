<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Jeremy Sain | Clarendon College</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #0f766e;
            --accent-hover: #0d9488;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --accent-color: #2dd4bf;
            --accent-hover: #14b8a6;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .position {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 0 0 4px 0;
            font-weight: 500;
        }

        .institution {
            font-size: 1.1rem;
            opacity: 0.8;
            margin: 0 0 28px 0;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
            margin-bottom: 24px;
        }

        [data-theme="dark"] .btn {
            color: #0f172a;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .theme-toggle-container {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--border-color);
        }

        #greeting {
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-style: italic;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dr. Jeremy Sain</h1>
        <p class="position">Professor</p>
        <p class="institution">Clarendon College</p>
        
        <p id="greeting"></p>

        <a href="partialfractions.html" class="btn">Go to Partial Fractions Tool</a>
        
        <div class="theme-toggle-container">
            <button id="theme-btn" class="theme-toggle">Toggle Dark Mode</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Setup dynamic timing greeting
            const greetingElement = document.getElementById('greeting');
            const currentHour = new Date().getHours();
            let greetingMessage = "Welcome to my academic homepage.";

            if (currentHour < 12) {
                greetingMessage = "Good morning! Welcome to my academic homepage.";
            } else if (currentHour < 18) {
                greetingMessage = "Good afternoon! Welcome to my academic homepage.";
            } else {
                greetingMessage = "Good evening! Welcome to my academic homepage.";
            }
            greetingElement.textContent = greetingMessage;

            // Setup dark mode button toggle action
            const themeBtn = document.getElementById('theme-btn');
            themeBtn.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            });
        });
    </script>
</body>
</html>
