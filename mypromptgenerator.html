<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lesson Prompt Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">AI Lesson Prompt Generator</h1>
        
        <form id="promptForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Lesson Title</label>
                    <input type="text" id="title" class="w-full mt-1 p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Duration (e.g., 60 mins)</label>
                    <input type="text" id="duration" class="w-full mt-1 p-2 border rounded-md">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Topics Covered</label>
                <textarea id="topics" class="w-full mt-1 p-2 border rounded-md h-20"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Learning Objectives</label>
                <textarea id="objectives" class="w-full mt-1 p-2 border rounded-md h-20"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Key Terms</label>
                    <input type="text" id="terms" class="w-full mt-1 p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Bloom's Taxonomy Level</label>
                    <select id="bloom" class="w-full mt-1 p-2 border rounded-md">
                        <option>Remembering</option>
                        <option>Understanding</option>
                        <option>Applying</option>
                        <option>Analyzing</option>
                        <option>Evaluating</option>
                        <option>Creating</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Activities (Check all that apply)</label>
                <div class="flex flex-wrap gap-4" id="activities">
                    <label><input type="checkbox" value="Interactive Learning"> Interactive</label>
                    <label><input type="checkbox" value="Assessments"> Assessments</label>
                    <label><input type="checkbox" value="Real-world Applications"> Applications</label>
                    <label><input type="checkbox" value="Case Studies"> Case Studies</label>
                    <label><input type="checkbox" value="Analogies"> Analogies</label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Target Audience</label>
                <input type="text" id="audience" class="w-full mt-1 p-2 border rounded-md" placeholder="e.g., Undergraduate Calculus Students">
            </div>

            <div class="flex items-center gap-4">
                <label class="font-semibold text-gray-700">ADA Compliant Structure:</label>
                <input type="checkbox" id="ada" class="w-5 h-5">
            </div>

            <button type="button" onclick="generatePrompt()" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-bold">Generate Prompt</button>
        </form>

        <div class="mt-8">
            <h2 class="text-lg font-bold text-gray-800 mb-2">Generated Prompt:</h2>
            <textarea id="output" readonly class="w-full p-4 bg-gray-100 border rounded-md h-64 text-sm"></textarea>
            <button onclick="copyToClipboard()" class="mt-2 w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        function generatePrompt() {
            const data = {
                title: document.getElementById('title').value,
                topics: document.getElementById('topics').value,
                objectives: document.getElementById('objectives').value,
                terms: document.getElementById('terms').value,
                bloom: document.getElementById('bloom').value,
                audience: document.getElementById('audience').value,
                duration: document.getElementById('duration').value,
                ada: document.getElementById('ada').checked ? "Ensure all materials are ADA compliant (alt text for images, high contrast, readable fonts, transcriptions for audio/video)." : "N/A",
                activities: Array.from(document.querySelectorAll('#activities input:checked')).map(cb => cb.value).join(', ')
            };

            const prompt = `Create a lesson plan for the following:
Title: ${data.title}
Audience: ${data.audience}
Duration: ${data.duration}
Bloom's Taxonomy Level: ${data.bloom}
Topics: ${data.topics}
Learning Objectives: ${data.objectives}
Key Terms: ${data.terms}
Requested Activities: ${data.activities}
ADA Guidelines: ${data.ada}

Please include:
1. A structured lesson flow.
2. Clear analogies for complex concepts.
3. Relevant real-world applications (specifically connecting these to the material).
4. Detailed content for the requested activities.`;

            document.getElementById('output').value = prompt;
        }

        function copyToClipboard() {
            const copyText = document.getElementById("output");
            copyText.select();
            document.execCommand("copy");
            alert("Prompt copied to clipboard!");
        }
    </script>
</body>
</html>
